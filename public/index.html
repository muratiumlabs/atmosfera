    const key = el.getAttribute('data-i18n');
    if (I18N_TR[key]) el.textContent = I18N_TR[key];
  });
  document.querySelectorAll('[data-i18n-empty]').forEach(el => {
    if (el.classList.contains('empty')) {
      const key = el.getAttribute('data-i18n-empty');
      if (I18N_TR[key]) el.textContent = I18N_TR[key];
    }
  });
  document.documentElement.lang = 'tr';
  // ── end i18n ──────────────────────────────────────────

  const root = document.documentElement;
  const themeButton = document.getElementById('btn-theme');
  const snapshotButton = document.getElementById('btn-snapshot');
  const snapshotModal = document.getElementById('snapshot-modal');
  const snapshotNote = null;
  const snapshotCancel = null;
  const snapshotSave = null;
  const snapshotSaved = document.getElementById('snapshot-saved');
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');

  const mouse = { x: null, y: null, radius: 140 };
  let particles = [];
  let particleCount = 118;
  const maxLinkDistance = 104;
  const maxParticles = 220;
  let lastSpawnTime = 0;

  function getTheme() {
    return root.getAttribute('data-theme') || 'light';
  }

  function themeColors() {
    return getTheme() === 'dark'
      ? { bg: '#050505', dot: '#C9A84C', line: '201, 168, 76', info: 'DARK MODE' }
      : { bg: '#f6f4f0', dot: '#8A6A21', line: '138, 106, 33', info: 'LIGHT MODE' };
  }

  function currentBpm() {
    const raw = window.atmosferaParams?.bpm || Number(document.getElementById('p-bpm')?.textContent) || 100;
    return Math.max(60, Math.min(200, Number(raw) || 100));
  }

  function bpmFactor() {
    return 0.65 + ((currentBpm() - 60) / 140) * 1.55;
  }

  function currentAtmosphereLabel() {
    const bpm = window.atmosferaParams?.bpm || document.getElementById('p-bpm')?.textContent || '—';
    const scale = window.atmosferaParams?.scale || document.getElementById('p-scale')?.textContent || '—';
    const density = window.atmosferaParams?.density ?? document.getElementById('p-density')?.textContent ?? '—';
    const bright = window.atmosferaParams?.brightness ?? document.getElementById('p-bright')?.textContent ?? '—';
    return `BPM ${bpm} · ${scale} · density ${density} · brightness ${bright}`;
  }

  function applyTheme(nextTheme) {
    root.setAttribute('data-theme', nextTheme);
    localStorage.setItem('atmosfera-theme', nextTheme);
    if (themeButton) {
      const lang = window.atmosferaLang || 'TR';
      if (lang === 'TR') {
        themeButton.textContent = nextTheme === 'dark' ? 'AYDINLIK MOD' : 'KOYU MOD';
      } else {
        themeButton.textContent = nextTheme === 'dark' ? 'LIGHT MODE' : 'DARK MODE';
      }
      themeButton.setAttribute('aria-label', nextTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    }
  }

  const savedTheme = localStorage.getItem('atmosfera-theme');
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');

  if (themeButton) {
    themeButton.addEventListener('click', () => {
      applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
    });
  }

  function randomBetween(min, max) {
    return Math.random() * (max - min) + min;
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    const area = window.innerWidth * window.innerHeight;
    particleCount = Math.max(80, Math.min(150, Math.floor(area / 9000)));
    createParticles();
  }

  function makeParticle(x = Math.random() * window.innerWidth, y = Math.random() * window.innerHeight, burst = 1) {
    return {
      x,
      y,
      vx: randomBetween(-0.55, 0.55) * burst,
      vy: randomBetween(-0.55, 0.55) * burst,
      size: randomBetween(1.15, 2.45),
      hit: 0,
    };
  }

  function createParticles() {
    particles = [];
    for (let i = 0; i < particleCount; i++) {
      particles.push(makeParticle());
    }
  }

  function spawnParticle(x, y, burst = 1.6) {
    if (particles.length >= maxParticles) return;
    particles.push(makeParticle(
      x + randomBetween(-8, 8),
      y + randomBetween(-8, 8),
      burst
    ));
  }

  function drawParticle(p) {
    const colors = themeColors();
    const pulseSize = p.size * (0.9 + bpmFactor() * 0.12);
    ctx.beginPath();
    ctx.arc(p.x, p.y, pulseSize, 0, Math.PI * 2);
    ctx.fillStyle = colors.dot;
    ctx.shadowColor = colors.dot;
    ctx.shadowBlur = p.hit > 0 ? 10 : 0;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawLink(a, b, alpha) {
    const colors = themeColors();
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = `rgba(${colors.line}, ${alpha})`;
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }

  function updateParticle(p) {
    if (mouse.x !== null && mouse.y !== null) {
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.hypot(dx, dy);

      if (dist < mouse.radius) {
        const force = (mouse.radius - dist) / mouse.radius;
        p.vx += dx * force * 0.0009;
        p.vy += dy * force * 0.0009;
      }
    }

    const pulse = bpmFactor();
    p.x += p.vx * pulse;
    p.y += p.vy * pulse;

    p.vx *= 0.992;
    p.vy *= 0.992;
    p.hit *= 0.92;

    if (Math.abs(p.vx) < 0.08) p.vx += randomBetween(-0.03, 0.03);
    if (Math.abs(p.vy) < 0.08) p.vy += randomBetween(-0.03, 0.03);

    if (p.x <= 0 || p.x >= window.innerWidth) p.vx *= -1;
    if (p.y <= 0 || p.y >= window.innerHeight) p.vy *= -1;

    p.x = Math.max(0, Math.min(window.innerWidth, p.x));
    p.y = Math.max(0, Math.min(window.innerHeight, p.y));
  }

  function animate() {
    const colors = themeColors();
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    for (const p of particles) {
      updateParticle(p);
      drawParticle(p);
    }

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i];
        const b = particles[j];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);

        if (dist < maxLinkDistance) {
          const alpha = 1 - dist / maxLinkDistance;
          drawLink(a, b, alpha * (0.30 + bpmFactor() * 0.16));
        }

        if (dist < 7 && particles.length < maxParticles && performance.now() - lastSpawnTime > Math.max(40, 120 - currentBpm() * 0.35)) {
          lastSpawnTime = performance.now();
          a.hit = b.hit = 1;
          a.vx *= -1.08; b.vx *= -1.08;
          a.vy *= -1.08; b.vy *= -1.08;
          spawnParticle((a.x + b.x) / 2, (a.y + b.y) / 2, 1.8 + bpmFactor() * 0.35);
        }
      }
    }

    requestAnimationFrame(animate);
  }

  function openSnapshotModal() {
    if (!snapshotModal) return;
    if (snapshotSaved) snapshotSaved.textContent = '';
    snapshotModal.classList.add('open');
    snapshotModal.setAttribute('aria-hidden', 'false');
    setTimeout(() => snapshotNote?.focus(), 30);
  }

  function closeSnapshotModal() {
    if (!snapshotModal) return;
    snapshotModal.classList.remove('open');
    snapshotModal.setAttribute('aria-hidden', 'true');
  }

  function wrapText(context, text, maxWidth) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    const lines = [];
    let line = '';

    words.forEach(word => {
      const testLine = line ? `${line} ${word}` : word;
      if (context.measureText(testLine).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = testLine;
      }
    });

    if (line) lines.push(line);
    return lines.slice(0, 4);
  }

  function saveParticleSnapshot() {
    if (!canvas) return;

    const note = document.getElementById('thoughts-text')?.textContent?.trim()
      || document.getElementById('reasoning')?.textContent?.trim()
      || (window.i18n ? window.i18n('thoughts-empty') : 'Makinenin düşünceleri henüz oluşmadı.');
    const colors = themeColors();
    const out = document.createElement('canvas');
    const outCtx = out.getContext('2d');
    const w = window.innerWidth;
    const h = window.innerHeight;

    out.width = w * devicePixelRatio;
    out.height = h * devicePixelRatio;
    outCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    outCtx.fillStyle = colors.bg;
    outCtx.fillRect(0, 0, w, h);
    outCtx.drawImage(canvas, 0, 0, w, h);

    const dark = getTheme() === 'dark';
    const textColor = dark ? '#E6D3AA' : '#8A6650';
    const shadowColor = dark ? 'rgba(0,0,0,0.72)' : 'rgba(255,252,246,0.90)';
    const maxTextWidth = Math.min(880, w - 76);
    const centerX = w / 2;
    const centerY = h / 2;

    outCtx.textAlign = 'center';
    outCtx.textBaseline = 'middle';

    const fontSize = Math.max(24, Math.min(34, Math.round(w / 46)));
    outCtx.font = `600 ${fontSize}px Playfair Display, Georgia, serif`;

    const lines = wrapText(outCtx, note, maxTextWidth).slice(0, 7);
    const lineHeight = Math.round(fontSize * 1.38);
    const blockH = lines.length * lineHeight;
    const startY = centerY - blockH / 2 + lineHeight / 2;

    // Soft readability only: no frame, no title.
    outCtx.shadowColor = shadowColor;
    outCtx.shadowBlur = 18;
    outCtx.shadowOffsetX = 0;
    outCtx.shadowOffsetY = 2;

    outCtx.fillStyle = textColor;
    lines.forEach((line, i) => {
      outCtx.fillText(line, centerX, startY + i * lineHeight);
    });

    outCtx.shadowBlur = 0;
    outCtx.shadowOffsetY = 0;

    const link = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    link.download = `atmosfera-night-map-${stamp}.png`;
    link.href = out.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    link.remove();

    if (snapshotSaved) snapshotSaved.textContent = window.i18n ? window.i18n('snapshot-saved') : 'Görsel kaydedildi.';
    
  }

  if (snapshotButton) snapshotButton.addEventListener('click', saveParticleSnapshot);
  if (snapshotCancel) snapshotCancel.addEventListener('click', closeSnapshotModal);
  if (snapshotSave) snapshotSave.addEventListener('click', saveParticleSnapshot);
  if (snapshotModal) {
    snapshotModal.addEventListener('click', (e) => {
      if (e.target === snapshotModal) closeSnapshotModal();
    });
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && snapshotModal?.classList.contains('open')) {
      closeSnapshotModal();
    }
  });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('click', (e) => {
    if (e.target.closest('button, input, textarea, select, summary, details, .snapshot-modal')) return;
    const burstCount = Math.min(14, Math.max(5, Math.round(currentBpm() / 18)));
    for (let i = 0; i < burstCount; i++) {
      spawnParticle(e.clientX, e.clientY, 2.1 + bpmFactor() * 0.45);
    }
  });

  window.addEventListener('mouseleave', () => {
    mouse.x = null;
    mouse.y = null;
  });

  window.addEventListener('resize', resizeCanvas);

  // ── CHARACTER CONTROLLER (VESPER + SERAPH SVG Robots) ──
  (function initCharacters() {
    const maleWrap     = document.getElementById('stage-vesper-wrap');
    const femaleWrap   = document.getElementById('stage-seraph-wrap');
    const maleFig      = document.getElementById('char-body-male');
    const femaleFig    = document.getElementById('char-body-female');
    const maleBubble   = document.getElementById('male-bubble');
    const femaleBubble = document.getElementById('female-bubble');
    const orbEl        = document.getElementById('char-orb');
    const vesperOrb    = document.getElementById('vesper-svg-orb');
    if (!maleWrap || !femaleWrap || !maleFig || !femaleFig) return;

    let charState = 'idle';
    let walkTimer = null;
    let stateTimers = [];

    // Speed helpers — all BPM-reactive
    function bpm()      { return Math.max(60, Math.min(200, window.atmosferaParams?.bpm || 100)); }
    function stepDur()  { return Math.max(0.24, 0.62 - ((bpm() - 60) / 140) * 0.30); }
    function walkDur()  { return Math.max(1.2,  3.8  - ((bpm() - 60) / 140) * 2.1);  }
    function swayDur()  { return Math.max(0.55, 2.6  - ((bpm() - 60) / 140) * 1.5);  }
    function danceDur() { return Math.max(0.32, stepDur() * 2); }

    // ── Icon SVGs (from ATMOSFERA Icon Set) ──────────────────────────
    const BICONS = {
      mic:    `<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="5" width="6" height="13" rx="3"></rect><path d="M10 14a6 6 0 0 0 12 0"></path><line x1="16" y1="20" x2="16" y2="25"></line><line x1="12" y1="25" x2="20" y2="25"></line></svg>`,
      cloud:  `<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 22a4.5 4.5 0 0 1 .6-9 6 6 0 0 1 11.5 1.2A4 4 0 0 1 22 22Z"></path></svg>`,
      thermo: `<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6a2 2 0 0 1 4 0v11a4 4 0 1 1-4 0Z"></path><line x1="16" y1="11" x2="16" y2="20"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="13" x2="22" y2="13"></line></svg>`,
      pin:    `<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 27c4-5 7-8.5 7-12a7 7 0 1 0-14 0c0 3.5 3 7 7 12Z"></path><circle cx="16" cy="15" r="2.6"></circle></svg>`,
      clock:  `<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="10"></circle><line x1="16" y1="16" x2="16" y2="10"></line><line class="etick" x1="16" y1="16" x2="20.5" y2="18.5"></line></svg>`,
      neural: `<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7v18"></path><path d="M16 9a4 4 0 0 0-6 3 3.5 3.5 0 0 0-1 5 3.5 3.5 0 0 0 2 4 3 3 0 0 0 5 1"></path><path d="M16 9a4 4 0 0 1 6 3 3.5 3.5 0 0 1 1 5 3.5 3.5 0 0 1-2 4 3 3 0 0 1-5 1"></path><circle cx="11" cy="13" r="1.1" class="eblip" fill="#C9A84C" stroke="none"></circle><circle cx="21" cy="18" r="1.1" class="eblip" fill="#C9A84C" stroke="none" style="animation-delay:.6s"></circle><circle cx="13" cy="21" r="1.1" class="eblip" fill="#C9A84C" stroke="none" style="animation-delay:1s"></circle></svg>`,
      gear:   `<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g class="espin"><circle cx="16" cy="16" r="3.4"></circle><path d="M16 6v3 M16 23v3 M6 16h3 M23 16h3 M9 9l2 2 M21 21l2 2 M23 9l-2 2 M11 21l-2 2"></path><circle cx="16" cy="16" r="8.2" stroke-dasharray="1.4 4.2"></circle></g></svg>`,
      note:   `<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 23V9l9-2v12"></path><circle cx="11" cy="23" r="2.2"></circle><circle cx="20" cy="19" r="2.2"></circle></svg>`,
      signal: `<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line class="ew1" x1="7" y1="14" x2="7" y2="18"></line><line class="ew2" x1="11" y1="11" x2="11" y2="21"></line><line class="ew3" x1="16" y1="7" x2="16" y2="25"></line><line class="ew2" x1="21" y1="11" x2="21" y2="21"></line><line class="ew1" x1="25" y1="14" x2="25" y2="18"></line></svg>`,
      dance:  `<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g class="ebob"><path d="M14 22V8l8-2"></path><path d="M14 12l8-2"></path><circle cx="12" cy="22" r="2.2"></circle><circle cx="22" cy="19" r="2.2"></circle></g></svg>`,
    };

    // Emotion bubbles
    function bubble(el, icon, hideAfterMs) {
      if (!el) return;
      el.innerHTML = BICONS[icon] || BICONS.note;
      el.classList.add('show');
      if (hideAfterMs > 0) setTimeout(() => el.classList.remove('show'), hideAfterMs);
    }
    function hideBubble(el) { el?.classList.remove('show'); }

    // Figure class helpers — char-body div'ine animasyon sınıfları uygulanır
    function setMaleCls(...add) {
      maleFig.classList.remove(
        'char-idle','char-walking','char-bounce','char-dance-male','char-thinking','char-sway'
      );
      if (add.length) maleFig.classList.add(...add);
    }
    function setFemaleCls(...add) {
      femaleFig.classList.remove(
        'char-idle','char-sway','char-dance','char-arms-open','char-thinking','char-walking','char-bounce'
      );
      if (add.length) femaleFig.classList.add(...add);
    }

    // Fly orb (DOM-based, multiple simultaneous)
    function flyOrb(sx, sy, ex, ey, color, durSec) {
      const orb = document.createElement('div');
      orb.className = 'fly-orb';
      orb.style.background = `radial-gradient(circle at 38% 35%, #fffbe8, ${color} 58%, #5a3800)`;
      orb.style.boxShadow = `0 0 10px 3px ${color}cc, 0 0 22px 7px ${color}55`;
      orb.style.setProperty('--orb-dur', durSec + 's');
      orb.style.left = sx + 'px';
      orb.style.top  = sy + 'px';
      orb.style.opacity = '1';
      document.body.appendChild(orb);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        orb.style.left = ex + 'px';
        orb.style.top  = ey + 'px';
      }));
      setTimeout(() => {
        orb.style.opacity = '0';
        setTimeout(() => orb.remove(), 280);
      }, durSec * 1000 - 80);
    }

    // clearTimers helper
    function clearTimers() {
      stateTimers.forEach(t => clearTimeout(t));
      stateTimers = [];
    }

    // Orb helpers
    function orbPlace(x, y, useTransition) {
      if (!orbEl) return;
      if (!useTransition) {
        orbEl.style.transition = 'opacity 0.3s';
      }
      orbEl.style.left = x + 'px';
      orbEl.style.top  = y + 'px';
    }
    function orbShow(x, y) {
      if (!orbEl) return;
      orbEl.classList.remove('orb-bursting');
      orbPlace(x, y, false);
      orbEl.style.opacity = '1';
    }
    function orbHide() {
      if (orbEl) orbEl.style.opacity = '0';
    }
    function orbBurst() {
      if (!orbEl) return;
      orbEl.classList.add('orb-bursting');
      setTimeout(() => { orbEl.classList.remove('orb-bursting'); orbHide(); }, 460);
    }

    // ── State handlers ──────────────────────────────────
    function goIdle() {
      charState = 'idle';
      clearTimers();
      if (walkTimer) { clearTimeout(walkTimer); walkTimer = null; }
      maleWrap.style.setProperty('--char-walk-dur', '0.001s');
      femaleWrap.style.setProperty('--char-walk-dur', '0.001s');
      maleWrap.style.transform   = 'translateX(0) translateY(0)';
      femaleWrap.style.transform = 'translateX(0) translateY(0)';
      maleFig.classList.remove('facing-left');
      femaleFig.classList.remove('facing-left');
      setMaleCls('char-idle');
      setFemaleCls('char-idle');
      hideBubble(maleBubble);
      hideBubble(femaleBubble);
      orbHide();
      if (vesperOrb) vesperOrb.style.opacity = '0';
      // Reveal any hidden cells
      document.querySelectorAll('.cell-data-hidden').forEach(el => el.classList.remove('cell-data-hidden'));
    }

    function onAnalyzing() {
      // Sadece veri teslimi sırasında kesme yapılmaz; dans/idle anında analiz başlayabilir
      if (charState === 'walking' || charState === 'receiving' || charState === 'returning') return;
      charState = 'analyzing';
      setMaleCls('char-bounce');     // VESPER zıplar
      setFemaleCls('char-thinking'); // SERAPH sallanır
      bubble(maleBubble, 'neural', 0);
      bubble(femaleBubble, 'cloud', 0);
      // Icon döngüsü (analiz süresince)
      const aIcons = ['neural','clock','gear','signal','note'];
      let ai = 0;
      function cycleAnalyze() {
        if (charState !== 'analyzing') return;
        ai++;
        bubble(maleBubble, aIcons[ai % aIcons.length], 0);
        setTimeout(cycleAnalyze, 900);
      }
      setTimeout(cycleAnalyze, 900);
    }

    function onParamsUpdated() {
      if (charState === 'walking' || charState === 'receiving' || charState === 'returning') return;
      if (window.innerWidth < 1100) return;
      if (walkTimer) clearTimeout(walkTimer);

      charState = 'walking';

      // Hücreleri hemen gizle
      ['reasoning','prompts','p-bpm','p-scale','p-density','p-bright'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('cell-data-hidden');
      });

      const sd = stepDur();
      const wd = walkDur();
      const dd = danceDur();

      maleWrap.style.setProperty('--char-walk-dur', wd + 's');
      maleFig.style.setProperty('--step-dur', sd + 's');

      const mR = maleWrap.getBoundingClientRect();
      const fR = femaleWrap.getBoundingClientRect();
      const MALE_CX     = mR.left + mR.width  / 2;
      const FEMALE_CX   = fR.left + fR.width  / 2;
      const MALE_HAND_Y   = mR.top + mR.height * 0.42;
      const FEMALE_HAND_Y = fR.top + fR.height * 0.42;

      // Ortam hücreleri
      const envPickups = [
        { id: 'in-noise',    icon: 'mic',    color: '#C9A84C' },
        { id: 'in-weather',  icon: 'cloud',  color: '#5B9BD5' },
        { id: 'in-temp',     icon: 'thermo', color: '#E07050' },
        { id: 'in-time',     icon: 'clock',  color: '#9B7BE8' },
        { id: 'in-movement', icon: 'pin',    color: '#7BCBA4' },
      ];

      // walkMaleTo helper
      function walkMaleTo(toCX, dur, facing, toHandY, cb) {
        if (charState !== 'walking' && charState !== 'receiving' && charState !== 'returning') { if(cb) cb(); return; }
        if (facing === 'left') maleFig.classList.add('facing-left');
        else maleFig.classList.remove('facing-left');
        const tx = toCX - MALE_CX;
        const ty = toHandY != null ? (toHandY - MALE_HAND_Y) : 0;
        maleWrap.style.setProperty('--char-walk-dur', dur + 's');
        maleFig.style.setProperty('--step-dur', stepDur() + 's');
        setMaleCls('char-walking');
        maleWrap.style.transform = `translateX(${tx}px) translateY(${ty}px)`;
        const t = setTimeout(() => {
          setMaleCls('char-idle');
          if (cb) cb();
        }, dur * 1000 + 60);
        stateTimers.push(t);
      }

      // walkFemaleTo helper
      function walkFemaleTo(toCX, dur, facing, toHandY, cb) {
        if (facing === 'left') femaleFig.classList.add('facing-left');
        else femaleFig.classList.remove('facing-left');
        const tx = toCX - FEMALE_CX;
        const ty = toHandY != null ? (toHandY - FEMALE_HAND_Y) : 0;
        femaleWrap.style.setProperty('--char-walk-dur', dur + 's');
        femaleFig.style.setProperty('--step-dur', stepDur() + 's');
        setFemaleCls('char-walking');
        femaleWrap.style.transform = `translateX(${tx}px) translateY(${ty}px)`;
        const t = setTimeout(() => {
          setFemaleCls('char-idle');
          if (cb) cb();
        }, dur * 1000 + 60);
        stateTimers.push(t);
      }

      // FAZ 1: VESPER ortam hücrelerine teker teker gider
      bubble(maleBubble, 'gear', 0);
      setMaleCls('char-idle');


      function malePickup(idx, done) {
        if (idx >= envPickups.length) { done(); return; }
        const pick   = envPickups[idx];
        const cellEl = document.getElementById(pick.id);
        if (!cellEl) { malePickup(idx + 1, done); return; }

        const targetEl = cellEl.closest('.cell') || cellEl;
        const cR = targetEl.getBoundingClientRect();

        const toCX = cR.left + cR.width * 0.65;

        walkMaleTo(toCX, 0.75, 'left', cR.top + cR.height / 2, () => {
          setMaleCls('char-bounce');
          bubble(maleBubble, pick.icon, 0);
          const mRN = maleWrap.getBoundingClientRect();
          // Orb: hücrenin SOL iç kısmından fırlar → karakterin sol eline gider (facing-left)
          const vR = cellEl.getBoundingClientRect();
          flyOrb(
            vR.left + 8,                          // hücre içi sol
            vR.top + vR.height * 0.5,             // hücre dikey merkezi
            mRN.left + mRN.width * 0.35,          // karakterin sola bakan eli
            mRN.top + mRN.height * 0.60,
            pick.color, 0.42
          );
          const t = setTimeout(() => {
            setMaleCls('char-idle');
            const t2 = setTimeout(() => malePickup(idx + 1, done), 80);
            stateTimers.push(t2);
          }, 460);
          stateTimers.push(t);
        });
      }

      malePickup(0, () => {
        // Verileri teslim edeceği için VESPER'ın SVG orbu görünür olur
        if (vesperOrb) vesperOrb.style.opacity = '1';
        bubble(maleBubble, 'signal', 0);
        const handoffCX = FEMALE_CX - 80;
        walkMaleTo(handoffCX, 1.6, 'right', null, () => {
          setMaleCls('char-bounce');
          bubble(maleBubble, 'gear', 0);
          // Orb teslim edildi — SVG orbu gizle
          if (vesperOrb) vesperOrb.style.opacity = '0';

          const mRN2 = maleWrap.getBoundingClientRect();
          const hX2  = mRN2.right - 4;
          const hY2  = mRN2.top + mRN2.height * 0.45;
          const fRN  = femaleWrap.getBoundingClientRect();
          const fX   = fRN.left + 10;
          const fY   = fRN.top + fRN.height * 0.42;

          envPickups.forEach((pick, i) => {
            const t = setTimeout(() => flyOrb(hX2, hY2, fX, fY, pick.color, 0.32), i * 110);
            stateTimers.push(t);
          });

          const t1 = setTimeout(() => {
            charState = 'receiving';
            setFemaleCls('char-arms-open');
            bubble(femaleBubble, 'dance', 0);

            const t2 = setTimeout(() => {
              setMaleCls('char-idle');
              setFemaleCls('char-idle');
              bubble(maleBubble, 'neural', 1600);

              // FAZ 2: SERAPH kutucuklara teker teker gider
              const deliveries = [
                { id: 'reasoning', icon: 'note',   color: '#C9A84C' },
                { id: 'prompts',   icon: 'dance',  color: '#7BCBA4' },
                { id: 'p-bpm',     icon: 'signal', color: '#5B9BD5' },
                { id: 'p-scale',   icon: 'note',   color: '#E07050' },
                { id: 'p-density', icon: 'cloud',  color: '#9B7BE8' },
                { id: 'p-bright',  icon: 'gear',   color: '#F0C84C' },
              ];

              function femaleDelivery(idx) {
                if (idx >= deliveries.length) {
                  // SERAPH eve döner
                  femaleFig.classList.remove('facing-left');
                  const curTX = parseFloat((femaleWrap.style.transform.match(/translateX\((-?[\d.]+)px\)/) || [0,0])[1]) || 0;
                  femaleWrap.style.setProperty('--char-walk-dur', '0.5s');
                  femaleWrap.style.transform = `translateX(${curTX}px) translateY(0)`;
                  const t = setTimeout(() => {
                    walkFemaleTo(FEMALE_CX, 1.2, 'right', null, () => {
                      femaleFig.classList.remove('facing-left');
                      bubble(femaleBubble, 'note', 0);
                      // VESPER de eve döner
                      walkMaleTo(MALE_CX, 1.4, 'left', null, () => {
                        maleFig.classList.remove('facing-left');
                        charState = 'idle';
                        bubble(maleBubble, 'gear', 1800);
                        setMaleCls('char-idle');
                        setFemaleCls('char-idle');
                      });
                    });
                  }, 500);
                  stateTimers.push(t);
                  return;
                }

                const d    = deliveries[idx];
                const dEl  = document.getElementById(d.id);
                if (!dEl) { femaleDelivery(idx + 1); return; }
                const dR = dEl.getBoundingClientRect();
                if (dR.width === 0) { femaleDelivery(idx + 1); return; }

                const targetCX    = Math.min(FEMALE_CX - 50, dR.left + dR.width / 2 + 50);
                const targetHandY = dR.top + dR.height / 2;

                walkFemaleTo(targetCX, 0.9, 'left', targetHandY, () => {
                  setFemaleCls('char-thinking');
                  bubble(femaleBubble, d.icon, 0);

                  const fRN = femaleWrap.getBoundingClientRect();
                  const hFX = fRN.left + 8;
                  const hFY = fRN.top + fRN.height * 0.45;

                  flyOrb(hFX, hFY, dR.left + dR.width / 2, dR.top + dR.height / 2, d.color, 0.35);

                  const t = setTimeout(() => {
                    dEl.classList.remove('cell-data-hidden');
                    dEl.classList.add('cell-data-reveal', 'cell-data-flash');
                    setTimeout(() => dEl.classList.remove('cell-data-reveal', 'cell-data-flash'), 520);
                    const t2 = setTimeout(() => femaleDelivery(idx + 1), 180);
                    stateTimers.push(t2);
                  }, 400);
                  stateTimers.push(t);
                });
              }

              femaleDelivery(0);
            }, 500);
            stateTimers.push(t2);
          }, envPickups.length * 110 + 360);
          stateTimers.push(t1);
        });
      });
    }

    function onPlaying() {
      if (charState === 'walking' || charState === 'receiving' || charState === 'returning') return;
      charState = 'dancing';
      maleFig.style.setProperty('--dance-dur', danceDur() + 's');
      femaleFig.style.setProperty('--sway-dur', swayDur() + 's');
      setMaleCls('char-dance-male');
      setFemaleCls('char-dance-female');  // SERAPH da artık dans ediyor
      bubble(maleBubble, 'note', 0);
      bubble(femaleBubble, 'dance', 0);

      let ph = 0;
      const mB = ['note','signal','neural','gear','dance','mic'];
      const fB = ['dance','note','signal','cloud','mic','dance'];
      function cycleBubble() {
        if (charState !== 'dancing') return;
        ph++;
        bubble(maleBubble,   mB[ph % mB.length], 0);
        bubble(femaleBubble, fB[ph % fB.length], 0);
        setTimeout(cycleBubble, 2200 + Math.random() * 1200);
      }
      setTimeout(cycleBubble, 2000);
    }

    function onPaused() {
      if (charState === 'walking' || charState === 'receiving' || charState === 'returning') return;
      goIdle();
      bubble(femaleBubble, 'cloud', 3200);
    }

    // Events
    window.addEventListener('atmosfera-analyzing',      onAnalyzing);
    window.addEventListener('atmosfera-params-updated', onParamsUpdated);
    window.addEventListener('atmosfera-playing',        onPlaying);
    window.addEventListener('atmosfera-paused',         onPaused);

    // BPM değişince hızı güncelle
    window.addEventListener('atmosfera-params-updated', () => {
      if (charState === 'dancing') {
        maleFig.style.setProperty('--dance-dur', danceDur() + 's');
        femaleFig.style.setProperty('--sway-dur', swayDur() + 's');
      }
    });

    goIdle();
  })();

  resizeCanvas();
  animate();
})();
</script>
</body>
</html>
