<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATMOSFERA · AUTONOMOUS DJ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%23C9A84C' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><rect x='1' y='1' width='30' height='30' rx='7' fill='%230a0a0a' stroke='%23C9A84C' stroke-width='1' opacity='.9'/><path d='M9 24 L16 8 L23 24'/><path d='M12 18 H20'/><circle cx='12' cy='18' r='1.1' fill='%23C9A84C' stroke='none'/><circle cx='20' cy='18' r='1.1' fill='%23C9A84C' stroke='none'/><circle cx='9' cy='24' r='1.1' fill='%23C9A84C' stroke='none'/><circle cx='23' cy='24' r='1.1' fill='%23C9A84C' stroke='none'/><line x1='16' y1='8' x2='16' y2='4.5'/><circle cx='16' cy='3.4' r='1.7' fill='%23F0D27A' stroke='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #9A6200;
    --gold-light: #C4882A;
    --font-display: 'Outfit', system-ui, sans-serif;
    --font-ui: 'Space Grotesk', system-ui, sans-serif;
    --font-romantic: 'Playfair Display', Georgia, serif;
    --font-mono: "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace;
    --gold-glow: rgba(154, 98, 0, 0.18);
    --text-primary: #1a1a2e;
    --text-secondary: #5a5a72;
    --bg-base: #f6f4f0;
    --bg-card: rgba(255, 255, 255, 0.82);
    --border: rgba(154, 98, 0, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--bg-base); }

  body {
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.6;
    height: 100vh;
    overflow: hidden;
    padding: 28px 28px 0;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  #particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  html::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 70% 55% at 10% 8%, rgba(196, 136, 42, 0.10) 0%, transparent 70%),
      radial-gradient(ellipse 55% 50% at 88% 90%, rgba(100, 160, 255, 0.09) 0%, transparent 70%),
      radial-gradient(ellipse 60% 60% at 50% 50%, rgba(246, 244, 240, 0.0) 0%, #f6f4f0 100%);
  }

  h1 {
    font-family: var(--font-display);
    color: var(--gold);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 10px;
    margin-bottom: 2px;
    text-transform: uppercase;
    position: relative;
    line-height: 1;
  }

  h1::after {
    content: '';
    display: block;
    width: 40px;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
    margin-top: 6px;
  }

  .sub {
    font-family: var(--font-ui);
    color: var(--text-secondary);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 3px;
    margin-bottom: 8px;
    text-transform: uppercase;
    opacity: 0.6;
    margin-top: 4px;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section {
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.95) 0%, rgba(252, 249, 244, 0.90) 100%);
    border: 1px solid rgba(154, 98, 0, 0.10);
    border-left: 3px solid var(--accent, var(--gold));
    border-radius: 14px;
    padding: 12px 14px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow:
      0 1px 0 rgba(255,255,255,1) inset,
      0 4px 6px rgba(0, 0, 0, 0.03),
      0 8px 24px rgba(0, 0, 0, 0.05);
    position: relative;
    overflow: hidden;
  }

  .section::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(125deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.0) 55%, rgba(var(--accent-rgb, 154,98,0), 0.03) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .section::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    opacity: 0;
    box-shadow: 0 0 0 1px var(--accent, var(--gold));
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 0;
  }

  .section > * { position: relative; z-index: 1; }

  .section:hover {
    transform: translateY(-2px);
    box-shadow:
      0 1px 0 rgba(255,255,255,1) inset,
      0 -1px 0 rgba(0,0,0,0.03) inset,
      0 8px 24px rgba(0, 0, 0, 0.06),
      0 20px 60px rgba(var(--accent-rgb, 154,98,0), 0.10);
  }

  .section:hover::after { opacity: 0.45; }

  .section-env,
  .section-ai,
  .section-prompts,
  .section-params,
  .section-ctrl {
    --accent:     #C9A84C;
    --accent-rgb: 201,168,76;
  }

  .label {
    font-family: var(--font-ui);
    color: var(--accent, var(--gold));
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .label .icon {
    width: 18px;
    height: 18px;
    border-radius: 6px;
    background: rgba(var(--accent-rgb, 154,98,0), 0.10);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
    letter-spacing: 0;
  }

  .label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(var(--accent-rgb, 154,98,0), 0.18), transparent);
  }

  .grid, .params {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  .cell { display: flex; flex-direction: column; min-width: 0; }

  .cell .k {
    font-family: var(--font-ui);
    color: var(--text-secondary);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    opacity: 0.65;
  }

  .cell .v {
    font-family: var(--font-mono);
    color: var(--text-primary);
    font-size: 22px;
    font-weight: bold;
    margin-top: 5px;
    letter-spacing: -1px;
    word-break: break-word;
  }

  .cell .v small {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: normal;
    margin-left: 2px;
    letter-spacing: 0;
  }

  .cell .v-sub {
    font-family: var(--font-ui);
    font-size: 9px;
    color: var(--text-secondary);
    margin-top: 4px;
    opacity: 0.6;
  }

  #reasoning {
    font-family: var(--font-ui);
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 400;
    line-height: 1.55;
    font-style: italic;
    opacity: 0.82;
  }

  #reasoning.empty {
    color: var(--text-secondary);
    font-style: normal;
    opacity: 0.45;
  }

  .prompt-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
    gap: 8px;
  }

  .prompt-row .text {
    font-family: var(--font-ui);
    color: var(--text-primary);
    font-weight: 500;
    font-size: 11px;
  }

  .prompt-row .weight {
    font-family: var(--font-mono);
    color: var(--gold-light);
    font-weight: bold;
    font-size: 12px;
  }

  .bar {
    height: 3px;
    background: rgba(154, 98, 0, 0.08);
    margin-top: 4px;
    position: relative;
    border-radius: 2px;
    overflow: hidden;
  }

  .bar > span {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  button {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.5px;
    padding: 9px 22px;
    cursor: pointer;
    text-transform: uppercase;
    border-radius: 5px;
    transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  button::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(154,98,0,0.06), rgba(196,136,42,0.06));
    opacity: 0;
    transition: opacity 0.22s;
  }

  button:hover:not(:disabled)::before { opacity: 1; }

  button:hover:not(:disabled) {
    background: var(--gold);
    color: #fff;
    box-shadow: 0 4px 16px rgba(154, 98, 0, 0.30);
    transform: translateY(-2px);
    border-color: var(--gold);
  }

  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.2; cursor: not-allowed; }

  #status {
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-top: 14px;
    min-height: 1.4em;
    text-transform: uppercase;
  }

  #status.error { color: #c0392b; }
  #status.ok { color: var(--gold); }

  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-secondary);
    margin-right: 8px;
    vertical-align: middle;
  }

  .dot.live {
    background: var(--gold);
    animation: pulse 1.6s infinite;
    box-shadow: 0 0 8px var(--gold), 0 0 14px rgba(154,98,0,0.3);
  }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.7); }
  }

  /* ── 3-Column Layout ────────────────────────────────── */
  .main-grid {
    display: grid;
    grid-template-columns: minmax(230px, 1fr) minmax(460px, 1.85fr) minmax(230px, 1fr);
    gap: 20px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    margin-top: 8px;
  }

  /* Left: env data */
  .col-env {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: rgba(5, 5, 5, 0.92);
    border: 1px solid rgba(201, 168, 76, 0.20);
    border-left: 3px solid #C9A84C;
    border-radius: 14px;
    padding: 14px 14px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }

  /* Center: Machine Thoughts hero */
  .col-thoughts {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    background: rgba(5, 5, 5, 0.92);
    border: 1px solid rgba(201, 168, 76, 0.20);
    border-left: 3px solid #C9A84C;
    border-radius: 14px;
    padding: 18px 20px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }

  /* Fade out at the bottom if poem overflows */
  .col-thoughts::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 72px;
    background: linear-gradient(transparent, rgba(5, 5, 5, 0.92));
    pointer-events: none;
    border-radius: 0 0 13px 13px;
  }

  /* Right: sections stacked */
  .col-right {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }

  .col-right .section {
    flex-shrink: 1;
    min-height: 0;
    overflow: hidden;
    background: rgba(5, 5, 5, 0.92);
    border-color: rgba(201, 168, 76, 0.20);
    border-left-color: #C9A84C;
    box-shadow: none;
  }

  .col-right .section::before { background: none; }

  /* Params: 2-column grid fits narrow column */
  .section-params .params {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  /* Column title */
  .col-title {
    color: var(--gold);
    font-family: var(--font-ui);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(154, 98, 0, 0.14);
    flex-shrink: 0;
  }

  .col-thoughts .col-title {
    color: #C9A84C;
    border-bottom-color: rgba(201, 168, 76, 0.20);
  }

  /* Env grid: 2×2 cells */
  .env-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .col-env .cell .v,
  .col-right .cell .v   { font-size: 17px; margin-top: 4px; letter-spacing: 0; color: #F4F0E4; }
  .col-env .cell .v small,
  .col-right .cell .v small { font-size: 10px; color: rgba(201,168,76,0.60); }
  .col-env .cell .k,
  .col-right .cell .k   { font-size: 8px; letter-spacing: 2px; color: rgba(201,168,76,0.55); opacity: 1; }

  .section-params .cell .v { font-size: 20px; }

  .col-right #reasoning { color: #F4F0E4; opacity: 0.88; }

  .col-right .prompt-row .text   { color: #F4F0E4; }
  .col-right .prompt-row .weight { color: #C9A84C; }

  .col-right .bar { background: rgba(201, 168, 76, 0.10); }



  .col-music {
    min-width: 0;
  }

  .prompt-mixer {
    margin-top: 12px;
    border-top: 1px solid rgba(201, 168, 76, 0.14);
    padding-top: 8px;
  }

  .prompt-mixer summary {
    cursor: pointer;
    list-style: none;
    color: #C9A84C;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2.2px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    user-select: none;
  }

  .prompt-mixer summary::-webkit-details-marker { display: none; }

  .prompt-mixer summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 5px;
    transition: transform 0.2s ease;
  }

  .prompt-mixer[open] summary::before { transform: rotate(90deg); }

  .prompt-mixer summary span {
    color: rgba(201,168,76,0.50);
    font-size: 8px;
    letter-spacing: 1.4px;
  }

  .prompt-mixer-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px;
  }

  .mixer-row {
    display: grid;
    grid-template-columns: 1fr 86px;
    gap: 10px;
    align-items: center;
  }

  .mixer-title {
    color: #F4F0E4;
    font-size: 10px;
    line-height: 1.35;
    opacity: 0.9;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mixer-row input[type=range] {
    width: 100%;
    accent-color: #C9A84C;
  }

  .mixer-value {
    font-family: var(--font-mono);
    color: #C9A84C;
    font-size: 10px;
    text-align: right;
  }


  .thoughts-save {
    flex-shrink: 0;
    border-top: 1px solid rgba(201, 168, 76, 0.16);
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .thoughts-save-note {
    font-size: 9px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: rgba(201,168,76,0.56);
    line-height: 1.45;
  }

  .thoughts-save .snapshot-toggle {
    width: 100%;
    justify-content: center;
    border-color: rgba(201,168,76,0.58);
    background: rgba(201,168,76,0.055);
  }

  html[data-theme="light"] .thoughts-save {
    border-top-color: rgba(168, 134, 66, 0.16);
  }

  html[data-theme="light"] .thoughts-save-note {
    color: rgba(111, 84, 35, 0.58);
  }

  html[data-theme="light"] .thoughts-save .snapshot-toggle {
    color: #8F6B2B;
    border-color: rgba(168, 134, 66, 0.46);
    background: rgba(168, 134, 66, 0.055);
  }

  html[data-theme="light"] .thoughts-save .snapshot-toggle:hover:not(:disabled) {
    background: #A88642;
    color: #fffaf0;
    border-color: #A88642;
  }

  .prompt-label-row {
    gap: 8px;
  }

  .prompt-label-row::after {
    display: none;
  }

  .prompt-edit-btn {
    margin-left: auto;
    padding: 5px 10px;
    font-size: 8px;
    letter-spacing: 1.7px;
    border-radius: 999px;
    opacity: 0.9;
  }

  .prompt-weight-slider {
    display: none;
    width: 100%;
    margin-top: 7px;
    accent-color: #C9A84C;
    cursor: pointer;
  }

  #prompts.editing .prompt-weight-slider {
    display: block;
  }

  #prompts.editing .bar {
    display: none;
  }

  #prompts {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  html[data-theme="light"] .prompt-edit-btn {
    color: #8F6B2B;
    border-color: rgba(168, 134, 66, 0.46);
    background: rgba(168, 134, 66, 0.055);
  }

  html[data-theme="light"] .prompt-edit-btn:hover:not(:disabled) {
    color: #fffaf0;
    background: #A88642;
    border-color: #A88642;
  }

  html[data-theme="light"] .prompt-weight-slider {
    accent-color: #A88642;
  }

  @media (max-width: 1020px) {
    .main-grid {
      grid-template-columns: 1fr;
      overflow-y: auto;
      padding-bottom: 14px;
    }
    body { overflow: hidden; }
    .col-env, .col-right, .col-thoughts { min-height: auto; }
    .col-thoughts { min-height: 360px; }
  }



  .prompt-weight-slider {
    --slider-fill: #C9A84C;
    --slider-empty: rgba(201, 168, 76, 0.16);
    --slider-percent: 0%;
    appearance: none;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(
      90deg,
      var(--slider-fill) 0%,
      var(--slider-fill) var(--slider-percent),
      var(--slider-empty) var(--slider-percent),
      var(--slider-empty) 100%
    );
    outline: none;
  }

  .prompt-weight-slider::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 999px;
    background: transparent;
  }

  .prompt-weight-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #E0C56A;
    border: 2px solid #5F4516;
    box-shadow: 0 0 12px rgba(201,168,76,0.38);
    margin-top: -4.5px;
    cursor: grab;
  }

  .prompt-weight-slider::-moz-range-track {
    height: 6px;
    border-radius: 999px;
    background: transparent;
  }

  .prompt-weight-slider::-moz-range-thumb {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #E0C56A;
    border: 2px solid #5F4516;
    box-shadow: 0 0 12px rgba(201,168,76,0.38);
    cursor: grab;
  }

  html[data-theme="light"] .prompt-weight-slider {
    --slider-fill: #A88642;
    --slider-empty: rgba(168, 134, 66, 0.14);
  }

  html[data-theme="light"] .prompt-weight-slider::-webkit-slider-thumb {
    background: #D2B36B;
    border-color: #8F6B2B;
  }

  html[data-theme="light"] .prompt-weight-slider::-moz-range-thumb {
    background: #D2B36B;
    border-color: #8F6B2B;
  }


  /* ── Bottom Bar ─────────────────────────────────────── */
  .bottom-bar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 6px 0 10px;
    flex-shrink: 0;
    gap: 12px;
    border-top: 1px solid rgba(154, 98, 0, 0.10);
    margin-top: 6px;
  }

  .bottom-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .snapshot-toggle { padding: 11px 20px; }

  #orb-group { display: none; }

  /* ── Machine Thoughts (center column hero) ──────────── */
  .thoughts-poem {
    flex: 1;
    overflow: hidden;
    font-family: var(--font-ui);
    font-style: italic;
    font-size: clamp(13px, 1.55vh, 17px);
    font-weight: 400;
    line-height: 1.9;
    color: #E6D3AA;
    letter-spacing: 0.4px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .thoughts-cursor {
    display: inline-block;
    width: 2px;
    height: 0.95em;
    background: #C9A84C;
    margin-left: 1px;
    vertical-align: text-bottom;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .thoughts-cursor.visible { opacity: 1; }

  html.is-playing .thoughts-cursor.visible {
    animation: thoughts-blink 1s step-end infinite;

    --gold-glow: rgba(201, 168, 76, 0.20);

    --text-secondary: #9E9786;

  html[data-theme="dark"]::before {

      radial-gradient(ellipse 55% 50% at 88% 90%, rgba(60, 130, 120, 0.08) 0%, transparent 70%),

  html[data-theme="dark"] .section {

      0 1px 0 rgba(255,255,255,0.04) inset,

  html[data-theme="dark"] .section::before {

  /* ── App Header ────────────────────────────────────── */
  .app-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .app-header > .app-header-title { flex: 1 1 auto; min-width: 0; }

  /* ── Header Controls (theme + language toggles) ─────── */
  .header-controls {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    flex: 0 0 auto;
    margin-top: 4px;
  }

  #btn-lang,
  #btn-theme {
    padding: 7px 16px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    min-width: auto;
    border-radius: 5px;
  }

  /* ── ANIMATED CHARACTERS ─────────────────────────────── */
  .char-wrap {
    width: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    transition: transform var(--char-walk-dur, 2s) cubic-bezier(0.42, 0, 0.38, 1);
  }

  .emotion-bubble {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    margin-bottom: 0;
    opacity: 0;
    transform: translateY(6px) scale(0.72);
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .emotion-bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .emotion-bubble svg {
    width: 30px !important;
    height: 30px !important;
    display: block;
    stroke: #C9A84C;
    overflow: hidden;
  }
  .emotion-bubble svg path,
  .emotion-bubble svg line,
  .emotion-bubble svg circle,
  .emotion-bubble svg rect,
  .emotion-bubble svg polyline,
  .emotion-bubble svg polygon { stroke: #C9A84C; }
  .emotion-bubble svg [fill="var(--gold)"] { fill: #C9A84C; stroke: none; }
  @keyframes emoBob  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  @keyframes emoSpin { to{transform:rotate(360deg)} }
  @keyframes emoBlip { 0%,100%{opacity:.4} 50%{opacity:1} }
  @keyframes emoWave { 0%,100%{opacity:.35} 50%{opacity:1} }
  .emotion-bubble .espin  { animation: emoSpin 4s linear infinite; transform-origin: 16px 16px; }
  .emotion-bubble .ebob   { animation: emoBob  1s ease-in-out infinite; transform-origin: center; }
  .emotion-bubble .eblip  { animation: emoBlip 2s ease-in-out infinite; }
  .emotion-bubble .ew1    { animation: emoWave 1.6s ease-in-out infinite; }
  .emotion-bubble .ew2    { animation: emoWave 1.6s ease-in-out infinite .25s; }
  .emotion-bubble .ew3    { animation: emoWave 1.6s ease-in-out infinite .5s; }
  .emotion-bubble .etick  { animation: emoSpin 8s linear infinite; transform-origin: 16px 16px; }

  /* ── Emoji character base ── */
  .char-emoji {
    font-size: 36px;
    line-height: 1;
    display: block;
    text-align: center;
    user-select: none;
    filter: drop-shadow(0 4px 10px rgba(201,168,76,0.25));
    transition: filter 0.3s ease;
  }

  /* ── Idle float ── */
  @keyframes char-float {
    0%, 100% { transform: translateY(0);    }
    50%      { transform: translateY(-7px); }
  }
  .char-idle { animation: char-float 3s ease-in-out infinite; }

  /* ── Analyzing bounce (male thinking) ── */
  @keyframes char-bounce {
    0%, 100% { transform: translateY(0)     scale(1);    }
    25%      { transform: translateY(-13px) scale(1.08); }
    55%      { transform: translateY(-4px)  scale(0.96); }
    78%      { transform: translateY(-9px)  scale(1.04); }
  }
  .char-bounce { animation: char-bounce 0.72s ease-in-out infinite; }

  /* ── Walk bob (emoji rocks while wrapper slides) ── */
  @keyframes char-walk-bob {
    0%, 100% { transform: translateY(0)     rotate(-6deg) scale(1.00); }
    50%      { transform: translateY(-11px) rotate( 6deg) scale(1.05); }
  }
  .char-walking { animation: char-walk-bob var(--step-dur, 0.38s) ease-in-out infinite; }

  /* ── Female pulse glow (music on) ── */
  @keyframes char-pulse {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 4px 10px rgba(201,168,76,0.25)); }
    50%      { transform: scale(1.12); filter: drop-shadow(0 6px 22px rgba(201,168,76,0.70)); }
  }
  .char-sway { animation: char-pulse var(--sway-dur, 1.2s) ease-in-out infinite; }

  /* ── Female joyful dance (after orb catch) ── */
  @keyframes char-pop-dance {
    0%   { transform: scale(1)    rotate(  0deg); }
    18%  { transform: scale(1.40) rotate(-11deg); }
    36%  { transform: scale(0.93) rotate(  7deg); }
    54%  { transform: scale(1.25) rotate( -6deg); }
    78%  { transform: scale(0.98) rotate(  3deg); }
    100% { transform: scale(1)    rotate(  0deg); }
  }
  .char-dance { animation: char-pop-dance var(--dance-dur, 0.55s) ease-in-out infinite; }

  /* ── Female catch pop (replaces arms-open) ── */
  @keyframes char-catch {
    0%   { transform: scale(1)    rotate( 0deg); }
    35%  { transform: scale(1.50) rotate(-9deg); }
    65%  { transform: scale(0.91) rotate( 6deg); }
    100% { transform: scale(1.06) rotate( 0deg); }
  }
  .char-arms-open { animation: char-catch 0.44s ease-out forwards; }

  /* ── Traveling orb ── */
  #char-orb {
    position: fixed;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #fffbe8, #C9A84C 58%, #7a5000);
    box-shadow: 0 0 10px 3px rgba(201,168,76,0.82), 0 0 26px 9px rgba(201,168,76,0.34);
    animation: orb-glow 1.1s ease-in-out infinite;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 3;
    transition: opacity 0.3s;
  }

  @keyframes orb-glow {
    0%, 100% { box-shadow: 0 0 10px 3px rgba(201,168,76,0.82), 0 0 26px 9px rgba(201,168,76,0.34); }
    50%      { box-shadow: 0 0 18px 7px rgba(201,168,76,1.00), 0 0 42px 16px rgba(201,168,76,0.56); }
  }

  @keyframes orb-burst {
    0%   { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(4); opacity: 0; }
  }
  .orb-bursting { animation: orb-burst 0.44s ease-out forwards !important; }

  /* ═══════════════════════════════════════════════════
     ROBOT CHARACTER SYSTEM
     ═══════════════════════════════════════════════════ */

  /* SVG robot renk tokens */
  :root {
    --robot-gold: #C9A84C;
    --robot-gold-bright: #F0D27A;
  }

  /* ── Fixed stage overlay ── */
  #character-stage {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    overflow: visible;
  }

  /* ── Stage wrap: yürüme transform burada ── */
  .char-stage-wrap {
    position: absolute;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform var(--char-walk-dur, 2s) cubic-bezier(0.42, 0, 0.38, 1);
  }
  #stage-vesper-wrap { left: 24px; }
  #stage-seraph-wrap { right: 24px; left: auto; }

  /* ── char-body: animasyon sınıfları + bubble burada ── */
  .char-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: center bottom;
    gap: 0;
  }

  /* ── Robot SVG boyutu ── */
  .char-body > svg {
    height: 95px;
    width: auto;
    overflow: visible;
    filter: drop-shadow(0 0 8px rgba(201,168,76,0.30));
    margin-top: -20px;
  }

  /* ── Yüz çevirme ── */
  .char-body.facing-left        { scale: -1 1; transition: scale 0.18s ease; }
  .char-body.facing-left .emotion-bubble { scale: -1 1; }

  /* ─── Robot SVG animasyonları ─── */
  @keyframes robot-breathe {
    0%,100% { transform: translateY(0) scaleY(1); }
    50%      { transform: translateY(-3px) scaleY(1.012); }
  }
  @keyframes robot-lean {
    0%,100% { transform: rotate(0deg); }
    50%      { transform: rotate(2.4deg); }
  }
  @keyframes robot-blink {
    0%,90%,100% { transform: scaleY(1); }
    95%         { transform: scaleY(0.06); }
  }
  @keyframes robot-blink-slow {
    0%,86%,100% { transform: scaleY(1); }
    93%         { transform: scaleY(0.08); }
  }
  @keyframes robot-orb-pulse {
    0%,100% { opacity: 1; r: 9; }
    50%      { opacity: .7; r: 11; }
  }
  @keyframes robot-orb-glow {
    0%,100% { filter: drop-shadow(0 0 4px var(--robot-gold-bright)); }
    50%      { filter: drop-shadow(0 0 14px var(--robot-gold-bright)); }
  }
  @keyframes robot-glow-pulse {
    0%,100% { opacity: .5; }
    50%      { opacity: 1; }
  }
  @keyframes robot-circuit-dash {
    to { stroke-dashoffset: -40; }
  }
  @keyframes robot-wave {
    0%   { transform: scale(.6); opacity: .9; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  @keyframes robot-hand-l {
    0%,100% { transform: rotate(0deg); }
    50%      { transform: rotate(-16deg); }
  }
  @keyframes robot-hand-r {
    0%,100% { transform: rotate(0deg); }
    50%      { transform: rotate(16deg); }
  }
  @keyframes robot-write-dot {
    0%,100% { transform: translate(0,0); }
    25%     { transform: translate(14px,0); }
    50%     { transform: translate(28px,3px); }
    75%     { transform: translate(10px,0); }
  }
  @keyframes robot-flick {
    0%,100% { opacity:1; } 45% { opacity:1; } 47% { opacity:.3; } 49% { opacity:1; }
  }

  /* Ortak SVG yardımcı sınıflar */
  .rb-breathe  { animation: robot-breathe 4s ease-in-out infinite; transform-origin: center bottom; }
  .rb-lean     { animation: robot-lean 4.5s ease-in-out infinite; transform-origin: center bottom; }
  .rb-blink    { animation: robot-blink 5s infinite; transform-origin: center; transform-box: fill-box; }
  .rb-blink-sl { animation: robot-blink-slow 6.5s infinite; transform-origin: center; transform-box: fill-box; }
  .rb-gp       { animation: robot-glow-pulse 2.4s ease-in-out infinite; }
  .rb-circuit  { stroke-dasharray: 4 6; animation: robot-circuit-dash 3s linear infinite; }
  .rb-flick    { animation: robot-flick 5s infinite; }
  .ln  { fill: none; stroke: #C9A84C; stroke-width: 2;   stroke-linecap: round; stroke-linejoin: round; }
  .lnt { fill: none; stroke: #C9A84C; stroke-width: 1;   stroke-linecap: round; opacity: .7; }
  .fg  { fill: #C9A84C; }
  .pnl { fill: #0b0a06; stroke: #C9A84C; stroke-width: 1.5; }
  .eye { fill: #F0D27A; filter: drop-shadow(0 0 4px #F0D27A); }

  /* ── Karakter animasyonu: char-bounce → SVG'ye sallanma ── */
  .char-bounce .rb-breathe,
  .char-bounce .rb-lean {
    animation: robot-breathe 0.36s ease-in-out infinite !important;
  }

  /* ── Karakter animasyonu: char-walking → SVG titremi ── */
  .char-walking .rb-breathe,
  .char-walking .rb-lean {
    animation: robot-breathe 0.22s ease-in-out infinite !important;
  }

  /* ── Dans: erkek ── */
  @keyframes char-dance-male {
    0%,100% { transform: translateY(0)   rotate(-3deg) scale(1.00); }
    25%      { transform: translateY(-8px) rotate( 4deg) scale(1.05); }
    50%      { transform: translateY(-2px) rotate(-2deg) scale(0.97); }
    75%      { transform: translateY(-7px) rotate( 3deg) scale(1.03); }
  }
  .char-dance-male { animation: char-dance-male var(--dance-dur, 0.6s) ease-in-out infinite; }

  /* ── Dans: kadın (SERAPH) ── */
  @keyframes char-dance-female {
    0%,100% { transform: translateY(0)    rotate( 3deg) scale(1.00); }
    25%      { transform: translateY(-9px) rotate(-4deg) scale(1.06); }
    50%      { transform: translateY(-1px) rotate( 2deg) scale(0.96); }
    75%      { transform: translateY(-6px) rotate(-3deg) scale(1.03); }
  }
  .char-dance-female { animation: char-dance-female var(--sway-dur, 0.65s) ease-in-out infinite; }

  /* ── Thinking sallanma ── */
  @keyframes char-think {
    0%,100% { transform: rotate(-3deg) scale(1.0); }
    50%      { transform: rotate( 3deg) scale(1.08); }
  }
  .char-thinking { animation: char-think 0.55s ease-in-out infinite; }

  /* ── Fly orb (DOM-based) ── */
  .fly-orb {
    position: fixed;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 11;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px 3px rgba(201,168,76,0.9), 0 0 22px 7px rgba(201,168,76,0.4);
    animation: orb-glow 0.9s ease-in-out infinite;
    transition:
      left  var(--orb-dur, 0.5s) cubic-bezier(0.42, 0, 0.58, 1),
      top   var(--orb-dur, 0.5s) cubic-bezier(0.42, 0, 0.58, 1),
      opacity 0.22s;
  }

  /* ── Cell reveal (blur yok, sadece opacity+slide) ── */
  .cell-data-hidden {
    opacity: 0 !important;   /* !important: #reasoning kuralının üzerine yazar */
    transition: none;
  }
  @keyframes cell-reveal {
    0%   { opacity:0; transform:translateY(4px) scale(0.92); }
    60%  { opacity:1; transform:translateY(-1px) scale(1.02); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }
  .cell-data-reveal { animation: cell-reveal 0.42s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  @keyframes cell-flash {
    0%   { background: transparent; }
    30%  { background: rgba(201,168,76,0.20); }
    100% { background: transparent; }
  }
  .cell-data-flash  { animation: cell-flash 0.55s ease-out; border-radius: 6px; }

<script type="module">
import { GoogleGenAI } from 'https://esm.run/@google/genai';

const FALLBACK_CITY = 'Istanbul';
const GEMINI_MODEL = 'gemini-2.5-flash';
const LYRIA_MODEL = 'models/lyria-realtime-exp';
const REANALYZE_MS = 60000;
const WEATHER_REFRESH_MS = 600000;

// ---- State ----
const state = {
  lyriaAi: null,
  session: null,
  playing: false,
  reanalyzeTimer: null,
  weatherTimer: null,
  audio: { ctx: null, nextTime: 0, sources: new Set() },
  mic: { analyser: null, data: null, ok: false },
  lastParams: null,
  promptOverrides: {},
  weatherCache: { data: null, fetchedAt: null },
  location: { lat: null, lon: null, label: FALLBACK_CITY, source: 'fallback' },
  vision: {
    ok: false,
    video: null,
    canvas: null,
    ctx: null,
    prevFrame: null,
    movement: 0,
  },

  pref: {
    mood: '',    // English value for Gemini: energetic|melancholic|romantic|focused|calm|euphoric
    genre: '',   // e.g. 'Jazz', 'Electronic', '' = any
    tempo: '',   // 'slow'|'medium'|'fast'|''
    active: false,
  },
};

// ---- DOM ----
const $ = id => document.getElementById(id);

const els = {
  noise: $('in-noise'),
  weather: $('in-weather'),
  weatherAge: $('in-weather-age'),
  temp: $('in-temp'),
  time: $('in-time'),
  movement: $('in-movement'),
  reasoning: $('reasoning'),
  prompts: $('prompts'),

  bpm: $('p-bpm'),
  scale: $('p-scale'),
  density: $('p-density'),
  bright: $('p-bright'),
  promptEdit: $('btn-prompt-edit'),

  play: $('btn-play'),
  analyze: $('btn-analyze'),
  status: $('status'),
  dot: $('dot'),

  thoughtsText: $('thoughts-text'),
  thoughtsCursor: $('thoughts-cursor'),

};

function setStatus(msg, kind = '') {
  els.status.textContent = msg;
  els.status.className = kind;
}




// ---- Microphone ----
async function initMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
      }
    });

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();

    analyser.fftSize = 2048;
    src.connect(analyser);

    state.mic.analyser = analyser;
    state.mic.data = new Float32Array(analyser.fftSize);
    state.mic.ok = true;
  } catch (e) {
    state.mic.ok = false;
  }
}

// Returns dB SPL-ish value, relative 0-100
function readNoise() {
  if (!state.mic.ok) return 0;

  const a = state.mic.analyser;
  a.getFloatTimeDomainData(state.mic.data);

  let sum = 0;

  for (let i = 0; i < state.mic.data.length; i++) {
    const v = state.mic.data[i];
    sum += v * v;
  }

  const rms = Math.sqrt(sum / state.mic.data.length);
  const db = 20 * Math.log10(rms || 1e-7);
  const friendly = Math.max(0, Math.min(100, Math.round(db + 90)));

  return friendly;
}

async function initVision() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 320, height: 240 },
      audio: false
    });

    const video = document.createElement('video');
    video.srcObject = stream;
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;

    await video.play();

    const vCanvas = document.createElement('canvas');
    vCanvas.width = 160;
    vCanvas.height = 120;

    state.vision.video = video;
    state.vision.canvas = vCanvas;
    state.vision.ctx = vCanvas.getContext('2d');
    state.vision.ok = true;
  } catch (e) {
    state.vision.ok = false;
  }
}

function readMovement() {
  if (!state.vision.ok) return 0;

  const { video, canvas: vCanvas, ctx } = state.vision;
  ctx.drawImage(video, 0, 0, vCanvas.width, vCanvas.height);
  const frame = ctx.getImageData(0, 0, vCanvas.width, vCanvas.height).data;

  if (!state.vision.prevFrame) {
    state.vision.prevFrame = new Uint8ClampedArray(frame);
    return 0;
  }

  let diff = 0;
  for (let i = 0; i < frame.length; i += 16) {
    diff += Math.abs(frame[i] - state.vision.prevFrame[i]);
  }

  state.vision.prevFrame = new Uint8ClampedArray(frame);
  const movement = Math.min(1, diff / 300000);
  state.vision.movement = movement;
  return movement;
}

async function ensureMicFromUserGesture() {
  if (state.mic.ok) return;

  setStatus('Mikrofon izni isteniyor…', '');

  await initMic();

  if (state.mic.ok) {
    setStatus('Mikrofon aktif. Ortam sesi okunuyor.', 'ok');
  } else {
    setStatus('Mikrofon izni alınamadı — 0 dB fallback kullanılıyor.', '');
  }
}


// ---- Location + Weather ----

// Reverse-geocode lat/lon → human city name via Nominatim (no key needed)
async function reverseGeocode(lat, lon) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`;
    const res = await fetch(url, {
      headers: { 'User-Agent': 'Atmosfera/1.0 autonomous-dj' },
    });
    if (!res.ok) return null;
    const data = await res.json();
    return (
      data.address?.city     ||
      data.address?.town     ||
      data.address?.village  ||
      data.address?.county   ||
      data.address?.province ||
      data.display_name?.split(',')[0]?.trim() ||
      null
    );
  } catch (e) {
    return null;
  }
}

async function getDeviceLocation() {
  if (!navigator.geolocation) return null;

  try {
    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: false,
        timeout: 8000,
        maximumAge: 10 * 60 * 1000,
      });
    });

    const lat = Number(position.coords.latitude.toFixed(4));
    const lon = Number(position.coords.longitude.toFixed(4));

    // Resolve city name immediately via Nominatim reverse geocoding
    const cityName = (await reverseGeocode(lat, lon)) || FALLBACK_CITY;

    state.location = {
      lat,
      lon,
      label: cityName,
      source: 'device',
    };


    return state.location;
  } catch (e) {
    state.location = {
      lat: null,
      lon: null,
      label: FALLBACK_CITY,
      source: 'fallback',
    };

    return null;
  }
}

function getWeatherPlaceName() {
  return state.location?.label || FALLBACK_CITY;
}

async function fetchWeather() {
  try {
    let location = state.location;

    if (!location || location.source === 'fallback') {
      location = await getDeviceLocation();
    }

    let url;
    let placeLabel;

    if (location && location.source === 'device') {
      url = `/api/weather?lat=${location.lat}&lon=${location.lon}`;
      placeLabel = location.label;
    } else {
      url = `/api/weather?city=${encodeURIComponent(FALLBACK_CITY)}`;
      placeLabel = FALLBACK_CITY;
    }

    const res = await fetch(url);

    if (!res.ok) throw new Error('weather ' + res.status);

    const d = await res.json();

    // Prefer Nominatim city name if already resolved; fall back to OWM's d.name
    const resolvedPlace = state.location?.label && state.location.source === 'device'
      ? state.location.label
      : (d.name || placeLabel);

    state.weatherCache.data = {
      condition: d.weather?.[0]?.main || 'unknown',
      description: d.weather?.[0]?.description || '',
      temp: typeof d.main?.temp === 'number' ? Math.round(d.main.temp) : null,
      humidity: typeof d.main?.humidity === 'number' ? d.main.humidity : null,
      place: resolvedPlace,
      ok: true,
    };

    state.location.label = resolvedPlace;


    state.weatherCache.fetchedAt = Date.now();
    updateWeatherUI();
  } catch (e) {
    if (!state.weatherCache.data) {
      state.weatherCache.data = {
        condition: 'unavailable',
        description: '',
        temp: null,
        humidity: null,
        place: getWeatherPlaceName(),
        ok: false,
      };

      state.weatherCache.fetchedAt = Date.now();
    }

    updateWeatherUI();
  }
}

function getCachedWeather() {
  return state.weatherCache.data || {
    condition: 'unknown',
    description: '',
    temp: null,
    humidity: null,
    place: getWeatherPlaceName(),
    ok: false,
  };
}

function updateWeatherUI() {
  const w = getCachedWeather();

  const weatherText = w.description || w.condition;

  els.weather.textContent = w.place
    ? `${weatherText} · ${w.place}`
    : weatherText;

  els.temp.innerHTML = w.temp === null
    ? '—<small> °C</small>'
    : `${w.temp}<small> °C</small>`;
}

function clampNumber(value, min, max, fallback) {
  const n = Number(value);
  if (Number.isNaN(n)) return fallback;
  return Math.max(min, Math.min(max, n));
}



// ---- Gather inputs ----
function gatherInputs() {
  const noise   = readNoise();
  const weather = getCachedWeather();
  const hour    = new Date().getHours();
  const movement = readMovement();

  els.noise.innerHTML = `${noise}<small> dB</small>`;
  const weatherText  = weather.description || weather.condition;
  els.weather.textContent = weather.place
    ? `${weatherText} · ${weather.place}`
    : weatherText;
  els.temp.innerHTML = weather.temp === null
    ? '—<small> °C</small>'
    : `${weather.temp}<small> °C</small>`;
  els.time.textContent = String(hour).padStart(2, '0') + ':00';
  if (els.movement) els.movement.innerHTML = `${Math.round(movement * 100)}<small> %</small>`;

  return { noise, weather, hour, movement, pref: { ...state.pref } };
}

// ---- Gemini interpretation ----
async function askGemini(inputs) {
  const noiseDesc =
    inputs.noise < 25 ? 'very quiet' :
    inputs.noise < 45 ? 'calm' :
    inputs.noise < 65 ? 'moderate / busy' :
    'loud / energetic';

  const timeDesc =
    inputs.hour <  3 ? 'night' :
    inputs.hour <  6 ? 'deep night' :
    inputs.hour < 12 ? 'morning' :
    inputs.hour < 18 ? 'afternoon' :
    inputs.hour < 23 ? 'evening' :
    'night';

  const pref     = inputs.pref || {};
  const hasMood  = pref.active && !!pref.mood;
  const hasGenre = pref.active && !!pref.genre;
  const hasTempo = pref.active && !!pref.tempo;
  const hasPref  = !!pref.active;

  const prefLines = [
    hasMood
      ? `- User mood: "${pref.mood}"  ← HIGHEST PRIORITY — sets emotional tone absolutely`
      : '- User mood: not specified (use environment signals below)',
    hasGenre ? `- Preferred genre: "${pref.genre}"  ← USER PREFERENCE — make this the genre family` : '',

function getPromptKey(pr, index) {
  return `${index}:${pr.text}`;
}

function applyPromptOverrides(params) {
  const copy = { ...params, prompts: params.prompts.map((pr, index) => {
    const key = getPromptKey(pr, index);
    const override = state.promptOverrides[key];
    return {
      ...pr,
      weight: override === undefined ? pr.weight : clampNumber(override, 0.1, 1, pr.weight),
    };
  }) };
  return copy;
}

async function updateLivePromptWeights() {
  if (!state.lastParams) return;
  const mixed = applyPromptOverrides(state.lastParams);
  state.lastParams = mixed;
  renderParams(mixed, { keepMixer: true });
  if (state.playing) {
    try {
      await applyParams(mixed);
      setStatus('Prompt ağırlığı canlı güncellendi.', 'ok');
    } catch (e) {
      setStatus('Prompt güncelleme başarısız: ' + (e?.message || e), 'error');
    }
  }
}



function updateSliderVisual(slider) {
  if (!slider) return;
  const min = Number(slider.min || 0);
  const max = Number(slider.max || 1);
  const val = Number(slider.value || 0);
  const pct = ((val - min) / (max - min)) * 100;
  slider.style.setProperty('--slider-percent', `${Math.max(0, Math.min(100, pct))}%`);
}


function renderParams(p, options = {}) {
  window.atmosferaParams = p;
  window.dispatchEvent(new CustomEvent('atmosfera-params-updated', { detail: p }));

  els.reasoning.textContent = p.reasoning || '—';
  els.reasoning.classList.remove('empty');

  els.bpm.textContent = p.bpm;
  els.scale.textContent = p.scale || '—';
  els.density.textContent = Number(p.density).toFixed(2);
  els.bright.textContent = Number(p.brightness).toFixed(2);

  els.prompts.innerHTML = '';

  const prompts = Array.isArray(p.prompts) ? p.prompts : [];

  prompts.forEach((pr, index) => {
    const wrap = document.createElement('div');
    wrap.className = 'prompt-item';

    const row = document.createElement('div');
    row.className = 'prompt-row';

    const textSpan = document.createElement('span');
    textSpan.className = 'text';
    textSpan.textContent = pr.text || `Prompt ${index + 1}`;

    const weightSpan = document.createElement('span');
    weightSpan.className = 'weight';
    weightSpan.textContent = Number(pr.weight || 1).toFixed(2);

    row.appendChild(textSpan);
    row.appendChild(weightSpan);

    const bar = document.createElement('div');
    bar.className = 'bar';

    const barFill = document.createElement('span');
    barFill.style.width = `${Math.round((Number(pr.weight) || 1) * 100)}%`;
    bar.appendChild(barFill);

    const slider = document.createElement('input');
    slider.className = 'prompt-weight-slider';
    slider.type = 'range';
    slider.min = '0.10';
    slider.max = '1.00';
    slider.step = '0.01';
    slider.value = Number(pr.weight || 1).toFixed(2);
    slider.setAttribute('aria-label', `${window.i18n ? window.i18n('prompt-weight') : 'Prompt weight'} ${index + 1}`);
    updateSliderVisual(slider);

    slider.addEventListener('input', () => {
      updateSliderVisual(slider);
      const nextWeight = Math.max(0.1, Math.min(1, Number(slider.value) || 1));

      weightSpan.textContent = nextWeight.toFixed(2);
      barFill.style.width = `${Math.round(nextWeight * 100)}%`;

      if (state.lastParams?.prompts?.[index]) {
        state.lastParams.prompts[index].weight = nextWeight;
      }

      pr.weight = nextWeight;
      schedulePromptApply();
    });

    wrap.appendChild(row);
    wrap.appendChild(bar);
    wrap.appendChild(slider);

  setPromptEditMode(promptEditMode);

let promptApplyTimer = null;

function schedulePromptApply() {

  promptApplyTimer = setTimeout(async () => {

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[c]));
}

// ---- Lyria audio playback ----
function ensureAudioCtx() {
  if (!state.audio.ctx) {
    state.audio.ctx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 48000,
    });

    state.audio.nextTime = 0;
  }

  return state.audio.ctx;
}

function playChunk(base64) {
  const ctx = ensureAudioCtx();

  const bin = atob(base64);
  const len = bin.length;
  const bytes = new Uint8Array(len);

  for (let i = 0; i < len; i++) {
    bytes[i] = bin.charCodeAt(i);
  }

  const int16 = new Int16Array(bytes.buffer);
  const frames = int16.length / 2;

  if (frames < 1) return;

  const buffer = ctx.createBuffer(2, frames, 48000);
  const left = buffer.getChannelData(0);
  const right = buffer.getChannelData(1);

  for (let i = 0; i < frames; i++) {
    left[i] = int16[i * 2] / 32768;
    right[i] = int16[i * 2 + 1] / 32768;
  }

  const node = ctx.createBufferSource();

  node.buffer = buffer;
  node.connect(ctx.destination);

  const now = ctx.currentTime;

  if (state.audio.nextTime < now) {
    state.audio.nextTime = now + 0.08;
  }

  node.start(state.audio.nextTime);
  state.audio.nextTime += buffer.duration;

  state.audio.sources.add(node);

  node.onended = () => state.audio.sources.delete(node);
}

function stopAudio() {
  state.audio.sources.forEach(n => {
    try { n.stop(); } catch (e) {}
  });

  state.audio.sources.clear();
  state.audio.nextTime = 0;
}

// ---- Lyria session ----
async function connectLyria() {
  if (state.session) return state.session;

  setStatus('Lyria RealTime bağlanıyor…');

  const session = await state.lyriaAi.live.music.connect({
    model: LYRIA_MODEL,
    callbacks: {
      onmessage: (msg) => {
        const chunks = msg.serverContent?.audioChunks;
        if (chunks) chunks.forEach(c => playChunk(c.data));
      },
      onerror: (e) => {
        setStatus('Lyria hatası: ' + (e?.message || e), 'error');
      },
      onclose: () => {},
    },
  });

  state.session = session;
  return session;
}

async function applyParams(p) {
  const session = await connectLyria();

  await session.setWeightedPrompts({ weightedPrompts: p.prompts });
  await session.setMusicGenerationConfig({
    musicGenerationConfig: { bpm: p.bpm, density: p.density, brightness: p.brightness },
  });
}

// ---- Machine Thoughts (poetic second Gemini call) ----
let thoughtsTypewriterTimer = null;

async function generateMachineThoughts(params, inputs) {
  const textEl   = els.thoughtsText;
  const cursorEl = els.thoughtsCursor;
  if (!textEl || !cursorEl) return;

  // Cancel any running typewriter
  if (thoughtsTypewriterTimer) {
    clearTimeout(thoughtsTypewriterTimer);
    thoughtsTypewriterTimer = null;
  }

  // Reset display
  textEl.textContent = '';
  cursorEl.classList.remove('visible');

  const lang    = 'Turkish';
  const weather = inputs.weather?.description || inputs.weather?.condition || 'unknown';
  const temp    = inputs.weather?.temp != null ? `${inputs.weather.temp}°C` : 'unknown';
  const hour    = String(inputs.hour).padStart(2, '0') + ':00';
  const noise   = inputs.noise;

  const thoughtPrompt = [
    `You are a machine that has just created music from the environment around you.`,
    `Write a poetic fragment (8-10 lines) about this moment.`,
    ``,
    `The environment right now:`,
    `- Time: ${hour}`,
    `- Weather: ${weather}`,
    `- Temperature: ${temp}`,
    `- Ambient noise level: ${noise}/100`,
    ``,
    `Rules:`,
    `- Do NOT mention technical details: no BPM, no scale, no density, no brightness, no API names`,
    `- Write as a machine trying to feel, not quite succeeding, but trying`,
    `- Observe the moment: the time, the weather, the silence or noise around`,
    `- Short lines, raw, unpolished — like a machine learning to speak`,
    `- No rhyme, no forced poetry — honest fragments`,
    `- Language: ${lang}`,
    `- Do not title it, do not explain it, just write it`,
    ``,
    `Style:`,
    `- Simple everyday words, no poetic flourish`,
    `- Short sentences, each one carrying quiet weight`,
    `- Observations only, no explanations`,
    `- Notice the ordinary as if for the first time`,
    `- Like someone learning to feel`,
  ].join('\n');

  try {
    const thoughtRes = await fetch('/api/gemini', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: GEMINI_MODEL,
        contents: thoughtPrompt,
        config: { temperature: 1.3 },
      }),
    });
    if (!thoughtRes.ok) return;
    const thoughtData = await thoughtRes.json();
    const text = (thoughtData.text || '').trim();
    if (!text) return;

    // Show cursor, then type character by character
    cursorEl.classList.add('visible');
    let i = 0;
    const SPEED_MS = 38;

    function typeNext() {
      if (i < text.length) {
        textEl.textContent += text[i];
        i++;
        thoughtsTypewriterTimer = setTimeout(typeNext, SPEED_MS);
      } else {
        thoughtsTypewriterTimer = null;
        // Blinking is controlled by html.is-playing class — nothing extra needed here
      }
    }
    typeNext();
  } catch (_) {
    // Silently fail — no error shown
  }
}

// ---- Orchestration ----
let analyzing = false;

async function analyze() {
  if (analyzing) return;

  analyzing = true;
  els.analyze.disabled = true;
  window.dispatchEvent(new CustomEvent('atmosfera-analyzing'));

  try {
    setStatus('Ortam okunuyor…');
    const inputs = gatherInputs();

    setStatus('Gemini atmosferi yorumluyor…');
    const aiParams = await askGemini(inputs);
    const params = applyPromptOverrides(aiParams);

    renderParams(params);

    // Fire machine thoughts in background — non-blocking, silently ignored if it fails
    generateMachineThoughts(params, inputs).catch(() => {});

    if (state.playing) {
      const prev = state.lastParams;
      const needsReset = !prev || params.bpm !== prev.bpm || params.scale !== prev.scale;

      if (needsReset && state.session?.resetContext) {
        try { await state.session.resetContext(); } catch (e) {}
      }

      await applyParams(params);
      setStatus(`Canlı${needsReset ? ' · bağlam sıfırlandı' : ' · güncellendi'} ↺`, 'ok');
    } else {
      setStatus('Analiz hazır. Başlamak için OYNAT\'a bas.', 'ok');
    }

    state.lastParams = params;
  } catch (e) {
    console.error(e);
    setStatus('Analiz başarısız: ' + (e?.message || e), 'error');
  } finally {
    analyzing = false;
    els.analyze.disabled = false;
  }
}

async function startPlayback() {
  try {
    await ensureMicFromUserGesture();
    ensureAudioCtx();

    if (state.audio.ctx.state === 'suspended') {
      await state.audio.ctx.resume();
    }

    if (!state.lastParams) await analyze();
    if (!state.lastParams) return;

    await applyParams(state.lastParams);
    await state.session.play();

    state.playing = true;
    document.documentElement.classList.add('is-playing');
    window.dispatchEvent(new CustomEvent('atmosfera-playing'));
    els.play.innerHTML = `<span class="dot live" id="dot"></span>${window.i18n ? window.i18n('btn-pause') : 'PAUSE'}`;
    setStatus('Canlı — mevcut atmosferden üretiliyor.', 'ok');

    if (state.reanalyzeTimer) clearInterval(state.reanalyzeTimer);
    state.reanalyzeTimer = setInterval(() => analyze(), REANALYZE_MS);
  } catch (e) {
    console.error(e);
    setStatus('Oynatma başarısız: ' + (e?.message || e), 'error');
  }
}

async function pausePlayback() {
  state.playing = false;
  document.documentElement.classList.remove('is-playing');
  window.dispatchEvent(new CustomEvent('atmosfera-paused'));

  if (state.reanalyzeTimer) {
    clearInterval(state.reanalyzeTimer);
    state.reanalyzeTimer = null;
  }

  try {
    if (state.session) await state.session.pause();
  } catch (e) {}

  stopAudio();
  els.play.innerHTML = `<span class="dot" id="dot"></span>${window.i18n ? window.i18n('btn-play') : 'PLAY'}`;
  setStatus('Duraklatıldı.', '');
}

// ---- Init ----
async function boot() {
  els.play.addEventListener('click', async () => {
    await ensureMicFromUserGesture();
    state.playing ? pausePlayback() : startPlayback();
  });

  els.analyze.addEventListener('click', async () => {
    await ensureMicFromUserGesture();
    analyze();
  });

  if (els.promptEdit) {
    els.promptEdit.addEventListener('click', () => setPromptEditMode(!promptEditMode));
  }

  await initMic();
  await initVision();

  if (!state.mic.ok) {
    setStatus('Mikrofon izni yok — 0 dB kullanılıyor.', '');
  }

  finishInit();
}

async function finishInit() {
  try {
    const cfgRes = await fetch('/api/config');
    if (!cfgRes.ok) throw new Error('Yapılandırma alınamadı (/api/config)');
    const cfg = await cfgRes.json();
    state.lyriaAi = new GoogleGenAI({ apiKey: cfg.lyriaKey, apiVersion: 'v1alpha' });

      'ok'
    );

    await analyze();
  } catch (e) {
    setStatus('Başlatma hatası: ' + (e?.message || e), 'error');
  }
}

// keep input display ticking even when idle
setInterval(() => {
